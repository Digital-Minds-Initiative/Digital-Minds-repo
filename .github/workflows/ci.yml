name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Non-secret CI settings. Every variable is documented in .env.example.
  DATABASE_URL: postgresql://dm:dm@localhost:5432/digital_minds_test
  TEST_DATABASE_URL: postgresql://dm:dm@localhost:5432/digital_minds_test
  ALLOWED_EMAIL_DOMAINS: uqu.edu.sa
  DEV_ACTOR_SWITCHER: 'false'
  NEXT_PUBLIC_API_MOCKING: disabled
  NEXT_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  no-env-files:
    name: No env files committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if an .env file is tracked
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::These files must never be committed (secrets):"
            echo "$tracked"
            exit 1
          fi

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # We squash-merge, so the PR title becomes the commit message on main.
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  verify:
    name: Typecheck, lint, unit tests, build
    needs: no-env-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm storybook:build

  integration:
    name: Integration tests (PostgreSQL)
    needs: no-env-files
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: dm
          POSTGRES_DB: digital_minds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dm -d digital_minds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
